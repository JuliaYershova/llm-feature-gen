site_name: LLM Feature Gen
site_description: Turn text, images, video, and tables into interpretable feature tables with LLMs.
site_url: https://juliayershova.github.io/llm-feature-gen/
repo_url: https://github.com/JuliaYershova/LLM-feature-gen
repo_name: JuliaYershova/LLM-feature-gen
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: [".", "docs"]
  - tables
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: list
            heading_level: 1
            merge_init_into_class: true
            parameter_headings: true
            show_root_full_path: false
            show_root_heading: true
            show_root_toc_entry: false
            show_signature_annotations: true
            show_source: false
            summary: true
nav:
  - Overview: index.md
  - Getting started:
      - Install: install.md
      - Quickstart: quickstart.md
      - Platform support: support.md
  - Guides:
      - Multiclass and batch workflows: advanced-workflows.md
      - Provider configuration: provider-configuration.md
      - Outputs and schema: outputs-schema.md
      - Reproducibility: reproducibility.md
      - When to use it: when-to-use.md
  - Examples:
      - Text-to-tabular pipeline: examples.md
  - API reference:
      - Discover: api/discover.md
      - Generate: api/generate.md
      - Multiclass: api/multiclass.md
      - Batch and caching: api/batch.md
      - Providers: api/providers.md
      - Utils: api/utils.md
  - Project:
      - Changelog: changelog.md
      - Contributing: contributing.md
      - Citing: citing.md
